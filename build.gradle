plugins {
	id 'fabric-loom' version '1.18.2'
	id 'java'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// TerraformersMC maven for ModMenu (compileOnly entrypoint API)
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// ModMenu: the artifact's fabric.mod.json declares a "modmenu" entrypoint
	// (com.automine.core.AutoMineModMenu) and suggests modmenu at runtime.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// JNA is used by the vendored de.labystudio.spotifyapi Windows integration
	// (com.sun.jna.*); shipped inside the mod jar via 'include' so the existing
	// runtime copy/extract path keeps working.
	include "net.java.dev.jna:jna:${project.jna_version}"
	include "net.java.dev.jna:jna-platform:${project.jna_version}"
	implementation "net.java.dev.jna:jna:${project.jna_version}"
	implementation "net.java.dev.jna:jna-platform:${project.jna_version}"
}

// All classes are now restored directly in src/main/java

processResources {
	inputs.property 'version', project.version
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
}

java {
	withSourcesJar()
}

jar {
	from('LICENSE_automine') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// The artifact ships com.google.gson usage (LicenseManager, the vendored
// spotifyapi library) against the versions bundled with the Minecraft client;
// they are provided at runtime by the game, so no extra dependency is needed.
